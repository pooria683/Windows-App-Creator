# WinForge-generated GitHub Actions workflow.
# Builds Windows (.exe), macOS (.dmg) and Linux
# (.AppImage/.deb/.rpm) on native runners: windows-latest, macos-latest,
# ubuntu-latest. Artifacts are uploaded to the workflow run and, on tags
# (v*), attached to a draft GitHub Release.
#
# Generated by: winforge ci
# App: Hello WinForge
# Template: electron
# Package manager: npm
# Signing: DISABLED (unsigned builds)
#
# NOTE: unsigned installers are NOT production-ready. Users will see
# SmartScreen / Gatekeeper warnings. See docs/signing.md.

name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (.exe installer / portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Build renderer + main (windows)
        run: |
          npm run build:web
          npm run build:main
      - name: Package (windows)
        run: npx electron-builder --win nsis portable --publish never
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha_cmd="sha256sum"
          command -v sha256sum >/dev/null 2>&1 || sha_cmd="shasum -a 256"
          for f in *; do
            case "$f" in *.yml|*.blockmap|*.json|SHA256SUMS.txt) continue;; esac
            if [ -f "$f" ]; then $sha_cmd "$f" >> SHA256SUMS.txt; fi
          done
          exit 0
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-${{ github.sha }}
          path: |
            release/*
            !**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Build renderer + main (macos)
        run: |
          npm run build:web
          npm run build:main
      - name: Package (macos)
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha_cmd="sha256sum"
          command -v sha256sum >/dev/null 2>&1 || sha_cmd="shasum -a 256"
          for f in *; do
            case "$f" in *.yml|*.blockmap|*.json|SHA256SUMS.txt) continue;; esac
            if [ -f "$f" ]; then $sha_cmd "$f" >> SHA256SUMS.txt; fi
          done
          exit 0
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-${{ github.sha }}
          path: |
            release/*
            !**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux (.AppImage / .deb / .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Build renderer + main (linux)
        run: |
          npm run build:web
          npm run build:main
      - name: Package (linux)
        run: npx electron-builder --linux AppImage deb rpm --publish never
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha_cmd="sha256sum"
          command -v sha256sum >/dev/null 2>&1 || sha_cmd="shasum -a 256"
          for f in *; do
            case "$f" in *.yml|*.blockmap|*.json|SHA256SUMS.txt) continue;; esac
            if [ -f "$f" ]; then $sha_cmd "$f" >> SHA256SUMS.txt; fi
          done
          exit 0
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ github.sha }}
          path: |
            release/*
            !**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  # Attaches the artifacts to a DRAFT GitHub Release on v* tags.
  # Draft + manual review is deliberate: verify installers before publishing,
  # and note that unsigned builds will trigger SmartScreen / Gatekeeper.
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/SHA256SUMS.txt


#
# Electron note: Electron *can* cross-build unsigned Windows NSIS/portable
# installers from macOS/Linux (Wine required), but CI builds are native and
# reproducible — and signing/notarization only works on the matching OS.
