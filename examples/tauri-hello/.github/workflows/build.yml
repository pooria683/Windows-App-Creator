# WinForge-generated GitHub Actions workflow.
# Builds Windows (.exe), macOS (.dmg) and Linux
# (.AppImage/.deb/.rpm) on native runners: windows-latest, macos-latest,
# ubuntu-latest. Artifacts are uploaded to the workflow run and, on tags
# (v*), attached to a draft GitHub Release.
#
# Generated by: winforge ci
# App: Hello Tauri
# Template: tauri
# Package manager: npm
# Signing: DISABLED (unsigned builds)
#
# NOTE: unsigned installers are NOT production-ready. Users will see
# SmartScreen / Gatekeeper warnings. See docs/signing.md.

name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-windows:
    name: Windows (.exe installer / portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build + bundle (windows)
        run: npx tauri build --bundles nsis
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*
            !**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build + bundle (macos)
        run: npx tauri build --bundles dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*
            !**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux (.AppImage / .deb / .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf rpm
      - name: Build + bundle (linux)
        run: npx tauri build --bundles appimage,deb,rpm
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*
            !**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  # Attaches the artifacts to a DRAFT GitHub Release on v* tags.
  # Draft + manual review is deliberate: verify installers before publishing,
  # and note that unsigned builds will trigger SmartScreen / Gatekeeper.
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/SHA256SUMS.txt


#
# Tauri note: Windows bundles are built on windows-latest because Rust
# cannot cross-compile Windows binaries from macOS/Linux. Linux bundles
# need the webkit2gtk/rpm packages installed above.
