# Publishes @winforge/cli to npm on v* tags (manual approval recommended).
# Requires an NPM_TOKEN repository secret. No secrets are committed.
name: Publish CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only (no publish)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test
      - name: Pack CLI
        working-directory: packages/cli
        run: npm pack --dry-run
      - name: Publish CLI
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        working-directory: packages/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
