# WinForge monorepo CI — lint, typecheck, tests, and a smoke test that
# scaffolds a project from each template on all three operating systems.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - run: npm run typecheck
      # Vitest's own failure annotations are the primary signal. On failure we
      # also emit the tail of the output as a workflow error annotation, which
      # is retrievable through the Checks API (useful when run logs are not).
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test-output.txt; then
            exit 0
          fi
          status=${PIPESTATUS[0]}
          {
            echo "::error title=Test failure details (${{ matrix.os }})::"
            # Escape for a workflow command message: % -> %25, CR dropped,
            # LF -> %0A so the whole tail stays in one annotation.
            tail -c 4000 test-output.txt | sed 's/%/%25/g' | tr -d '\r' | awk 'BEGIN{ORS="%0A"} {print}'
          }
          exit $status

      # Smoke tests run in the runner's temp dir, resolved by Node so the same
      # command works on Windows, macOS and Linux (no hardcoded /tmp).
      - name: Smoke test — scaffold Electron template
        run: node packages/cli/dist/index.js create "${{ runner.temp }}/wf-electron" --template electron --ui react --pm npm --non-interactive --no-install

      - name: Smoke test — scaffold Tauri template
        run: node packages/cli/dist/index.js create "${{ runner.temp }}/wf-tauri" --template tauri --ui react --pm npm --non-interactive --no-install

      - name: Smoke test — scaffold a Vue renderer overlay
        run: node packages/cli/dist/index.js create "${{ runner.temp }}/wf-vue" --template electron --ui vue --pm npm --non-interactive --no-install

      - name: Verify examples match templates
        run: npm run verify:examples

      - name: Smoke test — generated project typechecks and builds
        run: |
          cd "${{ runner.temp }}/wf-vue"
          npm install
          npm run build:web
          npm run build:main

      - name: Smoke test — doctor (JSON)
        run: node packages/cli/dist/index.js doctor --json > /dev/null || true
