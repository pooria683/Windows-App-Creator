# WinForge monorepo CI — lint, typecheck, tests, and a smoke test that
# scaffolds a project from each template on all three operating systems.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - run: npm run typecheck
      # Test output goes to the job summary so failures are readable from the
      # Actions UI / API without downloading logs.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Test output (${{ matrix.os }})"
            echo '```'
            tail -c 60000 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # Smoke tests run in the runner's temp dir, resolved by Node so the same
      # command works on Windows, macOS and Linux (no hardcoded /tmp).
      - name: Smoke test — scaffold Electron template
        run: node packages/cli/dist/index.js create "${{ runner.temp }}/wf-electron" --template electron --ui react --pm npm --non-interactive --no-install

      - name: Smoke test — scaffold Tauri template
        run: node packages/cli/dist/index.js create "${{ runner.temp }}/wf-tauri" --template tauri --ui react --pm npm --non-interactive --no-install

      - name: Smoke test — scaffold a Vue renderer overlay
        run: node packages/cli/dist/index.js create "${{ runner.temp }}/wf-vue" --template electron --ui vue --pm npm --non-interactive --no-install

      - name: Verify examples match templates
        run: npm run verify:examples

      - name: Smoke test — generated project typechecks and builds
        run: |
          cd "${{ runner.temp }}/wf-vue"
          npm install
          npm run build:web
          npm run build:main

      - name: Smoke test — doctor (JSON)
        run: node packages/cli/dist/index.js doctor --json > /dev/null || true
